name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk GameRadar.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameRadar-apk
          path: GameRadar.apk

      - name: Publish to "latest" release (easy phone download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest GameRadar.apk \
            --title "Game Radar (latest build)" \
            --notes "Download GameRadar.apk on your phone and open it to install."
